name: laravel-docker-examples-dev

# Settings shared by php-fpm and workspace, written once with YAML anchors:
# Compose ignores top-level keys that start with 'x-', '&xdebug' names this
# mapping, and '<<: *xdebug' in a service copies its keys there.
# -----------------------------------------------------------
# Xdebug reads these when a container starts, so a change in .env needs only
# 'up -d'. XDEBUG_ENABLED is a build argument and needs 'up -d --build'.
# -----------------------------------------------------------
x-xdebug: &xdebug
  XDEBUG_MODE: ${XDEBUG_MODE:-develop,debug}
  XDEBUG_HOST: ${XDEBUG_HOST:-host.docker.internal}
  XDEBUG_IDE_KEY: ${XDEBUG_IDE_KEY:-DOCKER}

services:
  web:
    image: nginx:1.30-alpine # Same image and configuration as production
    volumes:
      # Mount the application code for live updates
      - ./:/var/www
      - ./docker/common/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Localhost only: a debug-mode app shouldn't be reachable from the network,
      # and published ports bypass host firewalls such as ufw
      - "127.0.0.1:${NGINX_PORT:-80}:80"
    networks:
      - laravel-development
    depends_on:
      php-fpm:
        condition: service_started
    # Checks the application through nginx via Laravel's /up endpoint.
    healthcheck:
      # Addressed as 127.0.0.1: nginx listens on IPv4 only inside the container.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  php-fpm:
    build:
      context: .
      dockerfile: ./docker/common/Dockerfile
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        XDEBUG_ENABLED: ${XDEBUG_ENABLED:-true}
    environment:
      # The Xdebug variables from 'x-xdebug' at the top of this file
      <<: *xdebug
    # Docker Desktop resolves this name by itself; on Linux, Xdebug needs the mapping
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      # Mount the application code for live updates
      - ./:/var/www
    networks:
      - laravel-development
    depends_on:
      postgres:
        condition: service_healthy  # Wait until postgres accepts connections
      redis:
        condition: service_healthy

  workspace:
    build:
      context: .
      dockerfile: ./docker/common/Dockerfile
      target: workspace
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        XDEBUG_ENABLED: ${XDEBUG_ENABLED:-true}
    # Docker Desktop resolves this name by itself; on Linux, Xdebug needs the mapping
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      # The Xdebug variables, plus VITE_PORT. '<<' merges only into the
      # 'KEY: value' form, not into a '- KEY=value' list.
      <<: *xdebug
      VITE_PORT: ${VITE_PORT:-5173}
    ports:
      # The same port on both sides: Vite puts its own port into the asset URLs
      - '127.0.0.1:${VITE_PORT:-5173}:${VITE_PORT:-5173}'
    # Vite runs here through 'exec', so stopping the stack kills it before it
    # can remove public/hot, and pages then load assets from a dead dev server
    command: ["sh", "-c", "rm -f public/hot && exec bash"]
    # Either key keeps bash, the main process, running instead of exiting
    tty: true  # With a terminal, bash waits for input
    stdin_open: true  # Keeps bash's standard input open, for 'docker compose attach'
    volumes:
      - ./:/var/www
    networks:
      - laravel-development

  postgres:
    image: postgres:18
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      # The same credentials Laravel reads from .env
      - POSTGRES_DB=${DB_DATABASE:-app}
      - POSTGRES_USER=${DB_USERNAME:-laravel}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secret}
    volumes:
      # Postgres 18+ keeps its data in a versioned subdirectory (18/docker),
      # so the volume is mounted one level up from the old .../data path
      - postgres-data-development:/var/lib/postgresql
    networks:
      - laravel-development
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    networks:
      - laravel-development
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  laravel-development:

volumes:
  postgres-data-development:
