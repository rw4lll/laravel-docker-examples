name: laravel-docker-examples-prod

services:
  web:
    build:
      context: .
      dockerfile: ./docker/common/Dockerfile
      target: web
    restart: unless-stopped # Automatically restart unless the service is explicitly stopped
    volumes:
      # Files that Nginx serves at '/storage', through the 'public/storage' link.
      # -----------------------------------------------------------
      # 'subpath' mounts only 'app/public', so private files are not in this
      # container. Read-only: only the 'php-fpm' service writes files.
      # API-only project? Remove this mount.
      # -----------------------------------------------------------
      - type: volume
        source: laravel-storage-production
        target: /var/www/storage/app/public
        read_only: true
        volume:
          subpath: public
    networks:
      - laravel-production
    ports:
      # Map port 80 inside the container to the port specified by 'NGINX_PORT' on the host machine.
      # -----------------------------------------------------------
      # This allows external access to the Nginx web server running inside the container.
      # For example, if 'NGINX_PORT' is set to '8080', accessing 'http://localhost:8080' will reach the application.
      # -----------------------------------------------------------
      - "${NGINX_PORT:-80}:80"
    depends_on:
      php-fpm:
        condition: service_healthy  # Wait for php-fpm health check
    # Checks the application through nginx via Laravel's /up endpoint, which
    # covers more than php-fpm's own check of the FPM pool.
    healthcheck:
      # Addressed as 127.0.0.1: nginx listens on IPv4 only inside the container.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  php-fpm:
    # For the php-fpm service, we will create a custom image to install the necessary PHP extensions and setup proper permissions.
    build:
      context: .
      dockerfile: ./docker/common/Dockerfile
      target: production
    restart: unless-stopped
    volumes:
      # Keep the user files. This is the only part of 'storage' with data.
      # -----------------------------------------------------------
      # 'storage/framework' holds temporary files and 'storage/logs' is empty,
      # because logs go to stderr, so both can stay inside the container.
      # Mount 'storage/app' only: a mount over the whole 'storage' directory
      # hides the folders from the image, and Laravel then fails to start.
      # The volume can start empty - Laravel creates what it needs.
      # -----------------------------------------------------------
      - laravel-storage-production:/var/www/storage/app
    env_file:
      - .env
    environment:
      # Write logs to stderr, so 'docker compose logs php-fpm' shows them.
      - LOG_CHANNEL=stderr
    networks:
      - laravel-production
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    # The 'depends_on' attribute with 'condition: service_healthy' ensures that
    # this service will not start until the 'postgres' service passes its health check.
    # This prevents the application from trying to connect to the database before it's ready.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    user: postgres
    ports:
      # Published ports bypass host firewalls such as ufw, so keep it on localhost
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      # The same credentials Laravel reads from .env
      - POSTGRES_DB=${DB_DATABASE:-app}
      - POSTGRES_USER=${DB_USERNAME:-laravel}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secret}
    volumes:
      - postgres-data-production:/var/lib/postgresql/data
    networks:
      - laravel-production
    # Health check for PostgreSQL
    # -----------------------------------------------------------
    # Health checks allow Docker to determine if a service is operational.
    # The 'pg_isready' command checks if PostgreSQL is ready to accept connections.
    # This prevents dependent services from starting before the database is ready.
    # -----------------------------------------------------------
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: unless-stopped  # Automatically restart unless the service is explicitly stopped
    networks:
      - laravel-production
    # Health check for Redis
    # -----------------------------------------------------------
    # Checks if Redis is responding to the 'PING' command.
    # This ensures that the service is not only running but also operational.
    # -----------------------------------------------------------
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  # Attach the service to the 'laravel' network.
  # -----------------------------------------------------------
  # This custom network allows all services within it to communicate using their service names as hostnames.
  # For example, 'php-fpm' can connect to 'postgres' by using 'postgres' as the hostname.
  # -----------------------------------------------------------
  laravel-production:

volumes:
  postgres-data-production:
  laravel-storage-production:
