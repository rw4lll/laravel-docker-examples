# The server block, based on Laravel's reference configuration. It replaces
# the image's default server, and the image's nginx.conf still applies.
server {
    listen 80;
    server_name localhost;

    root /var/www/public;
    index index.php;

    charset utf-8;
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Matches post_max_size in docker/common/php/conf.d/uploads.ini
    client_max_body_size 20M;

    # Look up php-fpm on each request instead of once at startup, so nginx
    # keeps serving while php-fpm is recreated with a new address: a deploy
    # then costs a few 502s, not an outage. 127.0.0.11 is Docker's DNS;
    # elsewhere, such as Kubernetes, change both lines.
    resolver 127.0.0.11 valid=10s;
    set $php_fpm php-fpm:9000;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass $php_fpm;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Any other PHP file, such as one uploaded to the public disk, is neither
    # run nor sent as source. Case-insensitive, or an upload named shell.PHP
    # is sent as source, and on macOS and Windows a bind mount also serves
    # index.php for /INDEX.PHP.
    location ~* \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
