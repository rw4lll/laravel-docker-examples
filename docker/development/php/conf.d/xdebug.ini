; PHP reads these variables when the container starts, so a change in .env
; needs only 'docker compose -f compose.dev.yaml up -d', not a rebuild.
; Xdebug also reads XDEBUG_MODE directly, so 'exec -e XDEBUG_MODE=coverage'
; changes the mode for one command.
xdebug.mode = ${XDEBUG_MODE:-develop,debug}
xdebug.client_host = ${XDEBUG_HOST:-host.docker.internal}
xdebug.idekey = ${XDEBUG_IDE_KEY:-DOCKER}
xdebug.start_with_request = trigger
; Level 1 logs errors only, such as a failed connection to the IDE, through
; PHP's error log: the php-fpm container log, or stderr for CLI commands
xdebug.log_level = 1
